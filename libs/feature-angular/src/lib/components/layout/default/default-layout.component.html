<mat-drawer-container class="layout-container" autosize>
  <mat-drawer #drawer class="layout-sidenav" mode="side" opened>
    <div class="layout-sidenav-container">
      <mat-nav-list class="layout-sidenav-list">
        <a
          mat-list-item
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          (click)="drawer.toggle()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span>{{ item.title }}</span>
        </a>
      </mat-nav-list>
      <section class="layout-settings-container">
        <mat-divider class="layout-divider"></mat-divider>
        <lib-themes-colors-controls></lib-themes-colors-controls>
      </section>
    </div>
  </mat-drawer>

  <div class="layout-sidenav-content">
    <mat-toolbar class="layout-toolbar">
      <button mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">{{ title }}</span>
      <span class="toolbar-spacer"></span>
      <button
        mat-icon-button
        class="toolbar-icon favorite-icon"
        aria-label="Example icon-button with heart icon"
      >
        <mat-icon>notifications</mat-icon>
      </button>
    </mat-toolbar>
    <ng-content></ng-content>
  </div>
</mat-drawer-container>
