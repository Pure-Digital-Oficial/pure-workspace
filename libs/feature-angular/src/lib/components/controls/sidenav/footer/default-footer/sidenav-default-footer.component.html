<mat-accordion>
  <mat-expansion-panel
    (opened)="panelOpenState.set(true)"
    (closed)="panelOpenState.set(false)"
  >
    <mat-expansion-panel-header>{{ themeTitle }}</mat-expansion-panel-header>
    <lib-theme-color-controls></lib-theme-color-controls>
  </mat-expansion-panel>
</mat-accordion>
<section class="footer-signOut">
  <button mat-fab extended (click)="logout()">
    <mat-icon>logout</mat-icon>
    {{ logoutTitle }}
  </button>
</section>
