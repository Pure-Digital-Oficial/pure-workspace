<section class="theme-controls-section">
  <mat-select
    [value]="theme()"
    class="theme-colors-select"
    (selectionChange)="onThemeSelected($event)"
  >
    @for (color of themeList; track color) {
    <mat-option [value]="color">{{ getThemeColor(color)?.br }}</mat-option>
    }
  </mat-select>

  <div class="theme-button-container">
    <button mat-icon-button (click)="isDarkMode.set(!isDarkMode())">
      <mat-icon>
        {{ isDarkMode() ? 'dark_mode' : 'light_mode' }}
      </mat-icon>
    </button>
    <span>{{ isDarkMode() ? 'Escuro' : 'Claro' }}</span>
  </div>
</section>
