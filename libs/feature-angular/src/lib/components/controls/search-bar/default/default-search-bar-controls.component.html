<section class="search-section">
  <div class="search-container">
    <div class="search-input">
      <input
        type="text"
        [value]="searchValue"
        (input)="onInputChange($event)"
        (keyup.enter)="onEnter()"
        placeholder="Pesquisar..."
      />
      <lib-default-button-icon
        *ngIf="searchValue"
        [ariaLabel]="'Botão de limpar o barra de pesquisa'"
        [icon]="'close'"
        [description]="'Limpar'"
        (action)="onClearClick()"
      />
    </div>
    <button
      mat-fab
      aria-label="search-icon"
      [matTooltip]="description"
      (click)="onButtonClick()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
</section>
