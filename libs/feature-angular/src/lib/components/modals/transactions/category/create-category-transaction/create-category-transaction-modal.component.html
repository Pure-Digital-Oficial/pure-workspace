<lib-modal-layout
  [title]="'Cadastrar categoria da transação'"
  (clicked)="close()"
  (submited)="onSubmit()"
  [actionButtonTitle]="'Cadastrar'"
>
  <form [formGroup]="form" class="category-transacion-modal-form">
    <lib-default-input
      [required]="true"
      [type]="'text'"
      [label]="'Nome'"
      [placeholder]="'Digite o nome da transação'"
      formControlName="name"
    />
    <mat-form-field class="category-transacion-area">
      <mat-label>Descrição</mat-label>
      <textarea
        formControlName="description"
        [placeholder]="'Digite a descrição da transação'"
        matInput
      ></textarea>
    </mat-form-field>
  </form>
</lib-modal-layout>
