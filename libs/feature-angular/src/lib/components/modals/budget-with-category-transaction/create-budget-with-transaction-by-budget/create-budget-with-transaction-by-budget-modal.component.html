<lib-modal-layout
  [title]="'Cadastrar categoria ao orçamento'"
  (clicked)="close()"
  (submited)="onSubmit()"
  [actionButtonTitle]="'Cadastrar'"
>
  <form [formGroup]="form" class="modal-form">
    <mat-form-field class="modal-select-item">
      <mat-label>Categoria</mat-label>
      <mat-select formControlName="categoryTransactionId">
        <mat-option *ngFor="let category of categories()" [value]="category.id">
          {{ category.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</lib-modal-layout>
