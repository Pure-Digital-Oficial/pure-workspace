<div class="modal-header">
  <div class="modal-title-container">
    <mat-icon class="modal-icon-title">list_alt</mat-icon>
    <h2 mat-dialog-title>{{ title }}</h2>
  </div>
  <lib-default-button-icon
    class="modal-header-close-button"
    [ariaLabel]="'Botão de fechar o modal'"
    [icon]="'close'"
    [description]="'Fechar'"
    (action)="close()"
  />
</div>
<mat-dialog-content class="modal-container">
  <section class="modal-body">
    <section class="search-container">
      <lib-default-search-bar-controls
        (valueChange)="onSearchChange($event)"
        (action)="onCreate()"
      />
      <div class="list-container">
        <section class="paginator-container">
          <mat-paginator
            #paginators
            [length]="length()"
            [pageIndex]="pageIndex"
            [pageSize]="pageSize"
            (page)="onPageEvent($event)"
            [ariaLabel]="ariaLabel"
          >
          </mat-paginator>
        </section>
        <mat-list role="list" class="list">
          @for (categoryTransaction of categoryTransactions(); track
          categoryTransaction.id) {
          <lib-list-item-category-transaction-by-budget-controls
            [categoryTransaction]="categoryTransaction"
            (delete)="onDeleteRelationship($event)"
            (edit)="onEditRelationship($event)"
          />
          }
        </mat-list>
      </div>
    </section>
  </section>
</mat-dialog-content>
