<lib-modal-layout
  [title]="'Cadastrar orçamento a categoria'"
  (clicked)="close()"
  (submited)="onSubmit()"
  [actionButtonTitle]="'Cadastrar'"
>
  <form [formGroup]="form" class="modal-form">
    <mat-form-field class="modal-select-item">
      <mat-label>Orçamento</mat-label>
      <mat-select formControlName="budgetId">
        <mat-option *ngFor="let budget of budgets()" [value]="budget.id">
          {{ budget.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</lib-modal-layout>
