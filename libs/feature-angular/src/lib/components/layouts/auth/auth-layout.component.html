<main>
  <section class="form-section">
    <img [src]="logoImage" alt="logo" />
    <h2>{{ title }}</h2>
    <div class="form-content">
      <ng-content></ng-content>
    </div>
    <div class="btn-wrapper">
      <button class="form-button" mat-flat-button (click)="submit()">
        {{ primaryBtnText }}
      </button>
      <div class="form-divider">
        <div></div>
        <span>or</span>
        <div></div>
      </div>
      <button class="form-button" mat-stroked-button (click)="navigate()">
        {{ secondaryBtnText }}
      </button>
    </div>
  </section>
  <section class="main-section">
    <h1>{{ imagemTitle }}</h1>
    <img [src]="mainImage" alt="Login Image" />
  </section>
</main>
