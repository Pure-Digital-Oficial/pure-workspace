<div class="modal-header">
  <h2 mat-dialog-title>{{ title }}</h2>
  <lib-default-button-icon
    class="modal-header-close-button"
    [ariaLabel]="'Botão de fechar o modal'"
    [icon]="'close'"
    [description]="'Fechar'"
    (action)="onClose()"
  />
</div>
<mat-dialog-content class="modal-container">
  <ng-content></ng-content>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">{{ cancelButtonTitle }}</button>
  <button mat-button (click)="onSubmit()">{{ actionButtonTitle }}</button>
</mat-dialog-actions>
