<div class="modal-header">
  <h2 mat-dialog-title>{{ title }}</h2>
  <button mat-icon-button class="modal-header-close-button" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
</div>
<ng-content></ng-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">{{ cancelButtonTitle }}</button>
  <button mat-button (click)="onSubmit()">{{ actionButtonTitle }}</button>
</mat-dialog-actions>
