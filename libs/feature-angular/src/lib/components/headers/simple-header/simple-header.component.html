<header class="header">
  <div class="header__left">
    <img [src]="logo" alt="Logo" />
  </div>
  <nav class="header__center">
    <button
      *ngFor="let itemButton of menuButtons"
      [routerLink]="itemButton.route"
      [disabled]="itemButton.disabled"
    >
      {{ itemButton.label }}
    </button>
  </nav>
  <div class="header__right">
    <lib-theme-color-controls
      class="theme-control"
      [flexDirection]="'row'"
      [buttonText]="false"
    />
    <button
      mat-flat-button
      *ngIf="rightButton"
      [routerLink]="rightButton.route"
    >
      {{ rightButton.label }}
    </button>
  </div>
</header>
