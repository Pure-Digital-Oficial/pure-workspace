<lib-default-layout [title]="title" [menuItems]="menuItems">
  <section class="dashboard-container">
    <section class="filters-section">
      <lib-filters-dashboard-controls class="filters-section" />
    </section>
    <section class="cards-section">
      @for (total of totals( ); track total.title) {
      <lib-value-card [title]="total.title" [value]="total.total" />
      }
    </section>
    <section class="main-container">
      <section class="transactions-container">
        <div class="transactions-title-container">
          <mat-icon>account_balance</mat-icon>
          <span>Todas movimentações</span>
          <lib-default-button-icon
            [ariaLabel]="'Icone de opções'"
            [icon]="'more_horiz'"
            [description]="'Opções'"
            [matMenuTriggerFor]="menu"
            class="transaction-options"
          />
          <mat-menu #menu="matMenu">
            <button (click)="createTransactionAction()" mat-menu-item>
              <mat-icon>create</mat-icon>
              <span>Criar</span>
            </button>
          </mat-menu>
        </div>

        <mat-list class="transactions-list">
          @for (transaction of transactions(); track transaction.id) {
          <lib-list-item-transaction-home-controls
            [transaction]="transaction"
          />
          }
        </mat-list>
      </section>
      <section class="cards-container">
        <lib-graph-card [title]="'Transações por categoria'">
          <div
            highchartsChart
            [constructorType]="chartConstructor"
            [options]="chartOptions()"
            class="chart"
          ></div>
        </lib-graph-card>
        <lib-graph-card [title]="'Title Card 2'" />
      </section>
    </section>
  </section>
</lib-default-layout>
