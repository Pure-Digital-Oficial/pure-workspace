<lib-default-layout [title]="title" [menuItems]="menuItems">
  <lib-list-layout
    [length]="totalLength()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    (pageChange)="onPageEvent($event)"
    (searchChange)="onSearchValueChange($event)"
    (createAction)="createFixedGainAction()"
  >
    @for (budget of budgets(); track budget.id) {
    <lib-list-item-budget-controls
      [budget]="budget"
      (edit)="editFixedGainAction($event)"
      (delete)="deleteFixedGainAction($event)"
      (categories)="listCategoryTransactions($event)"
    />
    }
  </lib-list-layout>
</lib-default-layout>
