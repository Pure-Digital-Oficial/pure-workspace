<lib-default-layout [title]="title" [menuItems]="menuItems">
  <lib-list-layout
    [length]="totalLength()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    (pageChange)="onPageEvent($event)"
    (searchChange)="onSearchValueChange($event)"
    (createAction)="createCategoryTransactionAction()"
  >
    @for (categoryTransaction of categoryTransactions(); track
    categoryTransaction.id) {
    <lib-list-item-category-transaction-controls
      [categoryTransaction]="categoryTransaction"
      (edit)="editCategoryTransactionAction($event)"
      (delete)="deleteCategoryTransactionAction($event)"
      (budgets)="listBudgets($event)"
    />
    }
  </lib-list-layout>
</lib-default-layout>
