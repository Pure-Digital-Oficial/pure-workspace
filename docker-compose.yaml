version: '3.8'
services:
  server-general:
    build:
      context: .
      dockerfile: ./configs/docker/Dockerfile.server-pure-general
    ports:
      - '${SERVER_PURE_GENERAL_PORT}:${SERVER_PURE_GENERAL_PORT}'
    environment:
      - NODE_ENV=production
    networks:
      - shared_network
    env_file:
      - .env
  a-web-pure-digital:
    build:
      context: .
      dockerfile: ./configs/docker/Dockerfile.a-web-pure-digital
    ports:
      - '${WEB_A_PURE_DIGITAL_PORT}:80'
    environment:
      - NODE_ENV=production
    networks:
      - shared_network
    env_file:
      - .env

networks:
  shared_network:
    external: true
